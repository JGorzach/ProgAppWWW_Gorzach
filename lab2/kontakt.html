<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
        <title>Index_glowny</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="js/main.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Naglowek</h1>
            <h2>Podgląd lokalny. Formularz nie wysyła wiadomości</h2>
        </header>
        <nav>
            <a href="index.html">Strona główna</a> 
            <a href="kontakt.html" aria-current="page">Ta strona</a> 
            <a href="produkty.html">Produkty</a>
        </nav>
        <main>
            <form action="kontakt.html" method="get" id="formularz">
                <label for="mail">WYMAGANE Wpisz tutaj swoj mail</label>
                <input id="mail" type="email" name="e-mail" placeholder="Podaj e-mail" required>
                <label for="produkt">WYMAGANE Wybierz ktory produkt chcesz kupić</label>
                <select id="produkt" name="produkt" required>
                    <option value="">Wybierz produkt</option>
                    <option value="The_Car">The Car</option>
                    <option value="Hotel">Tranquilty Base Hotel &amp; Casino</option>
                    <option value="Demons_Days">Demon Days</option>
                </select>
                <label for="number">WYMAGANE Wpisz ilosc produktow od 1 do 5</label>
                <input id="number" type="number" name="number" required min="1" max="5" step="1">
                <label for="wiadomosc">WYMAGANE Wpisz tutaj swoja wiadomosc conajmniej 10 znaków</label>
                <textarea id="wiadomosc" name="wiadomosc" required minlength="10" maxlength="500"></textarea>
                <button type="submit">Sprawdź zapytanie</button>
                <div id="bledyWiadomosc"></div>
                <p>Cena: </p>
                <div id="cena"></div>
                <div id="podsumowanie"></div>
            </form>
        </main>

        <footer>
            <small>A to jest stopka&copy;</small>
            <input type="button" id="DarkMode" value="Tryb Ciemny"></input>
            <small id="zegar"></small>
            <button id="start">Start Zegaru</button>
            <button id="stop">Stop Zegaru</button>
        </footer>
    </body>
</html>
