<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
        <title>Index_glowny</title>
        <link rel="stylesheet" href="css/style.css"
    </head>
    <body>
        <header>
            <h1>Naglowek</h1><br>
            <h2>Formularz demonstracyjny. Dane pojawią się w adresie strony; zapytanie nie zostanie zapisane ani wysłane e-mailem</h2>
        </header>
        <nav>
            <a href="index.html">Strona główna</a> | 
            <a href="kontakt.html" aria-current="page">Ta strona</a> |
            <a href="produkty.html">Produkty</a>
        </nav>
        <main>
            <form action="kontakt.html" method="get">
                <label for="mail">WYMAGANE Wpisz tutaj swoj mail</label><br>
                <input id="mail" name="e-mail" placeholder="Podaj e-mail" requirded> <br>
                <label for="produkt">WYMAGANE Wybierz ktory produkt chcesz kupić</label><br> 
                <select id="produkt" name="produkt" required>
                    <option value="">Wybierz produkt</option>
                    <option value="The_Car">The Car</option>
                    <option value="Hotel">Tranquilty Base Hotel &amp Casino</option>
                    <option value="Demons_Days">Demon Days</option>
                </select><br>
                <label for="number">WYMAGANE Wpisz ilosc produktow od 1 do 5</label><br>
                <input id="number" type="number" name="ilosc" required min="1" max="5" step="1"><br>
                <label for="wiadomosc">WYMAGANE Wpisz tutaj swoja wiadomosc conajmniej 10 znaków</label> <br>
                <textarea id="wiadomosc" name="wiadomosc" required minlength="10" maxlength="500"></textarea><br>
                <button type="submit">Sprawdź zapytanie</button><br>
            </form>
        </main>

        <footer>
            <h6>A to jest stopka</h6>
        </footer>
    </body>
</html>
